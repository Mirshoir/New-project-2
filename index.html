<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Milana Premium — Katalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#b8953a;--gold-light:#d4af60;--cream:#faf7f2;
      --dark:#1a1510;--mid:#5c4f3a;--red:#c0392b;
      --border:rgba(184,149,58,0.22);
    }
    html{scroll-behavior:smooth}
    body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh}

    /* HEADER */
    header{
      position:sticky;top:0;z-index:200;
      background:rgba(250,247,242,0.97);backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 32px;height:76px;gap:20px;
    }
    .logo-wrap{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
    .logo-wrap img{height:46px;width:auto;object-fit:contain;display:block}
    .logo-wrap img + img{display:none}
    .header-right{display:flex;align-items:center;gap:20px;flex-shrink:0}
    .phone-link{
      display:flex;align-items:center;gap:8px;text-decoration:none;
      color:var(--dark);font-size:13px;font-weight:500;letter-spacing:.5px;white-space:nowrap;
    }
    .phone-link svg{width:16px;height:16px;fill:var(--red);flex-shrink:0}
    .lang-switcher{display:flex;align-items:center;gap:3px}
    .lang-btn{
      background:none;border:1px solid transparent;font-family:'Montserrat',sans-serif;
      font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
      color:var(--mid);cursor:pointer;padding:5px 9px;transition:all .2s;
    }
    .lang-btn:hover{color:var(--dark);border-color:var(--border)}
    .lang-btn.active{color:var(--gold);border-color:var(--gold)}
    .admin-trigger{
      display:inline-flex;align-items:center;justify-content:center;
      width:34px;height:34px;border:1px solid var(--border);
      color:var(--mid);background:rgba(255,255,255,.42);
      text-decoration:none;font-size:10px;font-weight:700;letter-spacing:1px;
      opacity:.58;transition:opacity .2s,border-color .2s,color .2s,background .2s;
    }
    .admin-trigger:hover,.admin-trigger:focus-visible{opacity:1;border-color:var(--gold);background:var(--dark);color:#fff}

    /* HERO */
    .hero{text-align:center;padding:80px 40px 55px;position:relative;overflow:hidden}
    .hero::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(184,149,58,0.07) 0%,transparent 70%);
      pointer-events:none;
    }
    .hero-tag{
      display:inline-block;font-size:9px;font-weight:600;letter-spacing:4px;text-transform:uppercase;
      color:var(--gold);border:1px solid var(--gold-light);padding:6px 18px;margin-bottom:24px;
    }
    .hero h1{
      font-family:'Cormorant Garamond',serif;font-size:clamp(38px,6vw,74px);
      font-weight:300;line-height:1.1;color:var(--dark);margin-bottom:16px;
    }
    .hero h1 em{font-style:italic;color:var(--gold)}
    .hero p{font-size:12px;font-weight:300;letter-spacing:1.5px;color:var(--mid);max-width:400px;margin:0 auto 44px}
    .divider{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:60px}
    .divider span{width:50px;height:1px;background:var(--gold-light)}
    .divider i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);display:inline-block}

    /* SECTION */
    .section-label{text-align:center;margin-bottom:44px}
    .section-label h2{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4vw,40px);font-weight:400;margin-bottom:8px}
    .section-label p{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}

    /* GRID — always 2x2 */
    .catalogs{max-width:960px;margin:0 auto;padding:0 32px 90px}
    .catalog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}

    /* CARD */
    .catalog-card{
      cursor:pointer;background:#fff;border:1px solid var(--border);
      transition:transform .35s ease,box-shadow .35s ease;
      animation:fadeUp .65s ease both;
    }
    .catalog-card:nth-child(1){animation-delay:.05s}
    .catalog-card:nth-child(2){animation-delay:.15s}
    .catalog-card:nth-child(3){animation-delay:.25s}
    .catalog-card:nth-child(4){animation-delay:.35s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .catalog-card:hover{transform:translateY(-5px);box-shadow:0 18px 50px rgba(184,149,58,0.15)}
    .catalog-card:focus-visible{outline:2px solid var(--gold);outline-offset:5px}

    .card-thumb{position:relative;overflow:hidden;aspect-ratio:3/4;background:#f0ebe3}
    .card-thumb iframe{width:100%;height:100%;border:none;pointer-events:none;display:block}
    .card-thumb .cover-img{width:100%;height:100%;object-fit:cover;display:block;background:#f0ebe3}
    .card-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

    .pdf-overlay{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:10px;
      opacity:0;transition:opacity .3s;
      background:rgba(26,21,16,0.52);backdrop-filter:blur(2px);
    }
    .catalog-card:hover .pdf-overlay{opacity:1}
    .ov-btn{
      padding:10px 24px;font-family:'Montserrat',sans-serif;font-size:9px;
      font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
      text-decoration:none;border:1px solid rgba(255,255,255,.8);
      color:#fff;background:transparent;cursor:pointer;transition:background .2s,border-color .2s;
    }
    .ov-btn.primary,.ov-btn:hover{background:var(--gold);border-color:var(--gold)}

    .card-body{padding:20px 22px 24px;border-top:1px solid var(--border)}
    .card-number{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
    .card-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin-bottom:3px}
    .card-sub{font-size:9px;letter-spacing:1.5px;color:var(--mid);text-transform:uppercase}

    /* MODAL — simple scroll viewer */
    .modal-backdrop{
      display:none;position:fixed;inset:0;z-index:300;
      background:rgba(8,6,4,0.9);backdrop-filter:blur(8px);
      align-items:center;justify-content:center;padding:16px;
    }
    .modal-backdrop.open{display:flex}
    .pdf-modal{
      position:relative;width:100%;max-width:860px;height:92vh;
      display:flex;flex-direction:column;
      animation:scaleIn .28s ease;
    }
    @keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    .modal-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 20px;background:var(--cream);border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400}
    .modal-actions{display:flex;gap:8px;align-items:center}
    .m-btn{
      padding:7px 18px;font-family:'Montserrat',sans-serif;font-size:9px;
      font-weight:600;letter-spacing:2px;text-transform:uppercase;
      cursor:pointer;border:none;text-decoration:none;display:inline-block;transition:background .2s;
    }
    .m-btn.dl{background:var(--gold);color:#fff}
    .m-btn.dl:hover{background:var(--dark)}
    .m-btn.cls{background:transparent;border:1px solid var(--border);color:var(--dark);font-size:17px;padding:3px 13px;letter-spacing:0}
    .m-btn.cls:hover{background:var(--dark);color:#fff}
    .modal-body{flex:1;overflow:hidden;background:#2a2520;display:flex}
    .modal-body iframe{width:100%;height:100%;border:none;display:block}
    /* FOOTER */
    footer{border-top:1px solid var(--border);padding:36px;text-align:center}
    footer img{height:34px;margin:0 auto 12px;display:block}
    footer p{font-size:9px;letter-spacing:2px;color:var(--mid);text-transform:uppercase}

    @media(max-width:700px){
      header{padding:0 16px;height:64px}
      .logo-wrap img{height:36px}
      .phone-link span{display:none}
      .admin-trigger{width:31px;height:31px;font-size:9px}
      .hero{padding:55px 18px 40px}
      .catalogs,.edit-section{padding:0 16px 50px}
      .catalog-grid{gap:16px}
      .edit-panel{padding:22px 16px}
    }
  </style>
</head>

const FIXED_MAN_TITLE = 'Milana Man Premium Collection';
function gtitle(c){
  // Keep this catalog name exactly the same for UZ / RU / EN.
  if(c.id === 2) return FIXED_MAN_TITLE;
  return c['title_'+currentLang] || c.title_en;
}
function gsub(c){   return c['sub_'+currentLang]   || c.sub_en;   }
function gcover(c){
  if(currentLang === 'uz') return c.cover_uz || c.cover_en || '';
  if(currentLang === 'ru') return c.cover_ru || c.cover_en || c.cover_uz || '';
  return c.cover_en || c.cover_uz || '';
}

function catalogUrl(c){
  return 'catalog.html?id=' + encodeURIComponent(c.id);
}

// ── RENDER CARDS ──────────────────────────────────
function renderCards(){
  const grid = document.getElementById('catalogGrid');
  grid.innerHTML = '';
  catalogs.forEach((cat, idx) => {
    const card = document.createElement('div');
    card.className = 'catalog-card';
    card.setAttribute('role', 'link');
    card.tabIndex = 0;
    const productUrl = catalogUrl(cat);

    const thumbInner = gcover(cat)
      ? '<img class="cover-img" src="' + gcover(cat) + '" alt="' + gtitle(cat).replace(/"/g,'&quot;') + '" loading="lazy">'
      : (cat.pdf
        ? '<iframe src="' + pdfEmbedUrl(cat.pdf) + '" loading="lazy"></iframe>'
        : '<div class="ph">' + (PH[idx]||PH[0]) + '</div>');

    const overlayInner = cat.pdf
      ? '<a class="ov-btn primary" href="' + productUrl + '">' + t('view') + '</a>'
      : '<button class="ov-btn primary" type="button" disabled>' + t('no_pdf') + '</button>';

    card.innerHTML =
      '<div class="card-thumb">' + thumbInner +
        '<div class="pdf-overlay">' + overlayInner + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-number">' + t('cat_label') + ' 0' + cat.id + '</div>' +
        '<div class="card-title">' + gtitle(cat) + '</div>' +
        '<div class="card-sub">' + gsub(cat) + '</div>' +
      '</div>';
    card.addEventListener('click', function(e){
      const interactive = e.target.closest ? e.target.closest('a,button') : null;
      if(interactive) return;
      window.location.href = productUrl;
    });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        window.location.href = productUrl;
      }
    });
    grid.appendChild(card);
  });
}

// ── PDF VIEWER ────────────────────────────────────
function pdfEmbedUrl(url){
  if(url.includes('drive.google.com')){
    const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    return m ? 'https://drive.google.com/file/d/'+m[1]+'/preview' : url;
  }
  return url + '#toolbar=1&navpanes=0&scrollbar=1';
}

function openPdf(idx){
  const cat = catalogs[idx];
  if(!cat.pdf) return;
  document.getElementById('modalTitle').textContent = gtitle(cat);
  document.getElementById('modalDl').href = cat.pdf;
  document.getElementById('modalDl').innerHTML = t('download');
  document.getElementById('pdfFrame').src = pdfEmbedUrl(cat.pdf);
  document.getElementById('modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('pdfFrame').src = '';
  document.body.style.overflow = '';
}

document.getElementById('modalBackdrop').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});
