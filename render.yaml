services:
  - type: web
    name: product-matcher
    env: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt -r requirements-ml.txt
    startCommand: uvicorn backend_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENABLE_CLIP
        value: "1"
      - key: CLIP_EAGER_LOAD
        value: "0"
      - key: CLIP_PRECOMPUTE_CATALOG
        value: "0"
      - key: CLIP_RERANK_POOL
        value: "80"
      - key: BACKEND_MAX_MEDIA_MB
        value: "25"
      - key: OCR_LANG
        value: "eng"
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
